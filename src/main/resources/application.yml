server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: network-device-backup
  thymeleaf:
    cache: false
    encoding: UTF-8
  web:
    resources:
      static-locations: classpath:/static/, classpath:/web/
      cache:
        period: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# 自定义配置
app:
  ssh:
    timeout: 30000
    connection-timeout: 10000
  database:
    path: ./nbbackup.db
  backup:
    max-concurrent: 10
